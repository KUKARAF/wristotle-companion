# Builds and publishes a signed release APK whenever a vX.Y.Z tag is pushed.
#
# Required Codeberg Actions secrets (Settings → Actions → Secrets):
#   WRISTOTLE_KEYSTORE_BASE64    base64-encoded contents of wristotle-release.keystore
#                                  generate locally: base64 -i wristotle-release.keystore | pbcopy
#   WRISTOTLE_KEYSTORE_PASSWORD  password set during `keytool -genkey`
#   WRISTOTLE_KEY_ALIAS          alias passed to `keytool -alias`
#   WRISTOTLE_KEY_PASSWORD       key alias password (usually same as KEYSTORE_PASSWORD)
#
# GITHUB_TOKEN is auto-provided by Forgejo Actions and has write access to
# releases on the same repo.

name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Codeberg's shared runners use sized labels rather than the generic
    # `docker`/`ubuntu-latest` GitHub conventions. The whisper.cpp + ggml
    # cold compile is the bulk of the wall time and benefits from the
    # extra CPU/RAM on the medium tier; small would also work but slower.
    runs-on: codeberg-medium
    steps:
      - name: Checkout (with whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify version literals match tag
        id: version
        shell: bash
        # Fail fast if app/build.gradle.kts's static versionCode /
        # versionName literals don't match the tag being released. F-Droid
        # builds the APK off those literals (no env-var override path), so
        # a tag-vs-fallback mismatch would publish a stale version on the
        # next F-Droid scan. Same check the local pre-push hook runs; this
        # is the belt-and-braces version that survives a `--no-verify`.
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          ACTUAL_NAME=$(sed -nE 's/.*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          ACTUAL_CODE=$(sed -nE 's/.*versionCode\s*=\s*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)

          echo "tag           = $TAG"
          echo "expected name = $VERSION"
          echo "expected code = $EXPECTED_CODE"
          echo "actual   name = $ACTUAL_NAME"
          echo "actual   code = $ACTUAL_CODE"

          if [ "$VERSION" != "$ACTUAL_NAME" ] || [ "$EXPECTED_CODE" != "$ACTUAL_CODE" ]; then
              echo "::error::tag $TAG does not match app/build.gradle.kts literals — bump the source file in the same commit as the tag and re-tag at the new commit."
              exit 1
          fi

          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$EXPECTED_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up persistent runner caches
        # The Codeberg runner's working dir is wiped per job, but $HOME
        # is persistent across builds. Point every heavy-download tool
        # (Android SDK, Gradle deps, Kotlin/Native toolchain, whisper.cpp
        # build outputs) at fixed paths under $HOME/.wristotle-ci-cache.
        # On first run after a fresh runner: downloads everything (~10
        # min total). Every subsequent build: caches are warm, downloads
        # skip themselves.
        #
        # This replaces the previous actions/cache steps, which need a
        # cache backend Codeberg Actions doesn't reliably expose and added
        # tar/upload/download overhead even when they worked.
        run: |
          CACHE_ROOT="$HOME/.wristotle-ci-cache"
          mkdir -p \
            "$CACHE_ROOT/android-sdk" \
            "$CACHE_ROOT/gradle" \
            "$CACHE_ROOT/kotlin-konan" \
            "$CACHE_ROOT/speech-whisper-cxx" \
            "$CACHE_ROOT/speech-whisper-cxx-intermediates"
          {
            echo "WRISTOTLE_CI_CACHE_ROOT=$CACHE_ROOT"
            echo "ANDROID_HOME=$CACHE_ROOT/android-sdk"
            echo "ANDROID_SDK_ROOT=$CACHE_ROOT/android-sdk"
            echo "GRADLE_USER_HOME=$CACHE_ROOT/gradle"
            echo "KONAN_DATA_DIR=$CACHE_ROOT/kotlin-konan"
          } >> $GITHUB_ENV
          # Pipe .cxx build artefacts through symlinks into the persistent
          # cache. AGP writes through the symlinks; the next build inherits
          # the .o files without re-running CMake's configure step.
          ln -snf "$CACHE_ROOT/speech-whisper-cxx" speech-whisper/.cxx
          mkdir -p speech-whisper/build/intermediates
          ln -snf "$CACHE_ROOT/speech-whisper-cxx-intermediates" speech-whisper/build/intermediates/cxx
          du -sh "$CACHE_ROOT"/* 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Skip gradle/actions/setup-gradle's built-in build cache — we're
        # already pointing GRADLE_USER_HOME at the persistent runner cache
        # above. Just install Gradle itself.
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Set up Android SDK
        # Forgejo's action mirror (data.forgejo.org) only carries a subset
        # of upstream actions, and android-actions/setup-android isn't
        # among them. Use the GitHub URL explicitly — Forgejo Actions
        # accepts the full https://github.com/owner/repo@ref form.
        #
        # Pinned to v3.2.2 because the floating `@v3` ref changed under
        # us between v1.7.0 (success) and v1.7.1 (failure) and its
        # internal sdkmanager started prompting interactively.
        #
        # Reads ANDROID_HOME from the env we set above, so cmdline-tools
        # land in the persistent cache. First run: downloads cmdline-tools.
        # Subsequent runs: sees existing install, fast-skips download.
        uses: https://github.com/android-actions/setup-android@v3.2.2
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Re-accept Android SDK licenses (defensive)
        # Belt-and-braces against runner state drift — cmdline-tools
        # version changes under us can leave previously-accepted licenses
        # mismatched. Pipe `yes` defensively; cheap (~1s).
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install pinned NDK + CMake
        # The :speech-whisper module pins ndkVersion = 30.0.14904198 and
        # CMake 3.22.1. sdkmanager is idempotent — first run downloads
        # (~1.6 GB NDK), subsequent runs see existing install at
        # $ANDROID_HOME/ndk/30.0.14904198 and skip.
        run: sdkmanager --install "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WRISTOTLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/wristotle-release.keystore"
          test -s "$GITHUB_WORKSPACE/wristotle-release.keystore"

      - name: Ensure jq is available
        # Codeberg's shared runner image (catthehacker/ubuntu) ships with
        # jq pre-installed; the leaner image self-hosted runners often
        # default to doesn't. The publish step builds its JSON payloads
        # via jq, so install it up front instead of failing later with
        # an opaque 422 from the Codeberg API.
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends jq
          fi

      - name: Run unit tests
        # Fail fast before paying the release-build cost if a recent commit
        # broke a dedup / slot / prefix test. --no-daemon for the same
        # reason as assembleRelease below: the medium runner is tight on
        # RAM, and a long-lived daemon + the forked test JVM + cmake/ninja
        # subprocesses competing on a ~4 GB box trip the OOM killer.
        # v0.14.1 saw two consecutive daemon-disappeared failures here
        # before this was added; --no-daemon cleared it.
        run: ./gradlew --no-daemon -Dorg.gradle.workers.max=2 :app:testDebugUnitTest :wristotle-core:testAndroidHostTest :speech-whisper:testDebugUnitTest

      - name: Build release APK
        env:
          WRISTOTLE_KEYSTORE_FILE: ${{ github.workspace }}/wristotle-release.keystore
          WRISTOTLE_KEYSTORE_PASSWORD: ${{ secrets.WRISTOTLE_KEYSTORE_PASSWORD }}
          WRISTOTLE_KEY_ALIAS: ${{ secrets.WRISTOTLE_KEY_ALIAS }}
          WRISTOTLE_KEY_PASSWORD: ${{ secrets.WRISTOTLE_KEY_PASSWORD }}
          # versionCode / versionName are not env-overridden — they live
          # as static literals in app/build.gradle.kts and CI verified
          # above that they match the tag. JVM heaps live in
          # gradle.properties so the daemon actually honours them (CLI
          # overrides reach the launcher only, not the daemon). What's
          # left here is ninja's parallel-compile cap so whisper.cpp +
          # ggml don't fork 4 g++ subprocesses on top of the ~3 GB of
          # JVM heap and exceed the medium runner's budget.
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: ./gradlew --no-daemon -Dorg.gradle.workers.max=2 :app:assembleRelease

      - name: Verify signing cert
        # Defence against accidental key rotation: every release MUST
        # be signed by the same cert that v1.0.0 was signed by. F-Droid
        # pins this fingerprint in AllowedAPKSigningKeys; a different
        # key would also break the existing in-place upgrade path on
        # users' phones. Hard-fails if the SHA-256 doesn't match.
        run: |
          set -eu
          EXPECTED=b2312ec6767a28db57eb4bf78033274d83df81fcdac7e968ebaaea5efb69aea5
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs \
                     app/build/outputs/apk/release/app-release.apk \
                   | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "expected = $EXPECTED"
          echo "actual   = $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::signing cert SHA-256 changed — refusing to publish. Confirm key rotation was intentional, then update the EXPECTED literal here + F-Droid's AllowedAPKSigningKeys + announce the key change to users."
              exit 1
          fi

      - name: Stage APK + sha256 checksum under versioned names
        # sha256sums.txt sits alongside the APK on the release page so
        # users who download manually can verify the download integrity
        # without trusting the page itself. F-Droid doesn't need it
        # (they verify by signature), but it's standard sideload-trust
        # hygiene.
        run: |
          set -eu
          VERSION=${{ steps.version.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk \
             "wristotle-companion-${VERSION}.apk"
          sha256sum "wristotle-companion-${VERSION}.apk" > sha256sums.txt
          cat sha256sums.txt

      - name: Publish release + upload APK
        env:
          CODEBERG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -eu

          # Auto-generate the change list from commit subjects since the
          # previous tag. fetch-depth: 0 gives full history + tags. First
          # release (no prior tag) falls back to the whole history.
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:'- %s')
            SINCE="Changes since \`$PREV_TAG\`:"
          else
            CHANGES=$(git log "${TAG}" --no-merges --pretty=format:'- %s')
            SINCE="Changes:"
          fi
          [ -n "$CHANGES" ] || CHANGES="- (no code changes)"

          BODY=$(cat <<EOF
          Built from \`$TAG\` ($(git rev-parse --short HEAD)).

          $SINCE

          $CHANGES

          Full commit log on the [Code tab](https://codeberg.org/${GITHUB_REPOSITORY}/commits/branch/main).

          Install: download the APK below, sideload onto an Android 7.0+ phone, then follow the first-time setup in the README.
          EOF
          )

          api() { curl -sS -w '\n%{http_code}' "$@"; }

          # Codeberg auto-creates a release entry for every pushed tag, but
          # that stub gets `created_at = 1970-01-01` and PATCH doesn't refresh
          # the timestamp — so the release sinks to the bottom of the
          # date-sorted releases list (caught after the v1.6.1 retag, when
          # the page appeared empty even though the assets were attached).
          # Workaround: always DELETE the stub (or any prior release for this
          # tag, including a previous re-run) and POST a fresh one. The asset
          # upload loop below re-attaches the APK + sha256 on the new id.
          RELEASE_LOOKUP=$(api \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            -H "Authorization: token ${CODEBERG_TOKEN}")
          LOOKUP_BODY=$(printf '%s' "$RELEASE_LOOKUP" | sed '$d')
          LOOKUP_STATUS=$(printf '%s' "$RELEASE_LOOKUP" | tail -n1)

          if [ "$LOOKUP_STATUS" = "200" ]; then
            OLD_ID=$(echo "$LOOKUP_BODY" | jq -r '.id')
            echo "Removing prior release ${OLD_ID} for ${TAG} so the new one gets a fresh created_at."
            curl -fsS -X DELETE \
              "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${OLD_ID}" \
              -H "Authorization: token ${CODEBERG_TOKEN}"
          fi

          echo "Creating fresh release for ${TAG}."
          CREATE_RESP=$(curl -fsS -X POST \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "$TAG" --arg name "Wristotle Companion $VERSION" --arg body "$BODY" \
                  '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
          RELEASE_ID=$(echo "$CREATE_RESP" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Couldn't resolve a release id."
            exit 1
          fi

          # Fetch the asset list once; the per-asset loop below deletes
          # any previously-uploaded copy (re-run of the workflow on the
          # same tag — Codeberg's upload endpoint rejects duplicate
          # filenames within a release).
          EXISTING_ASSETS=$(curl -fsS \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            -H "Authorization: token ${CODEBERG_TOKEN}")

          # Attach the APK + sha256sums.txt as release assets.
          for ASSET in "wristotle-companion-${VERSION}.apk" sha256sums.txt; do
              DUP_ID=$(echo "$EXISTING_ASSETS" | jq -r ".[] | select(.name == \"${ASSET}\") | .id")
              if [ -n "$DUP_ID" ] && [ "$DUP_ID" != "null" ]; then
                  echo "Removing previously-uploaded ${ASSET} (asset ${DUP_ID})."
                  curl -fsS -X DELETE \
                    "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets/${DUP_ID}" \
                    -H "Authorization: token ${CODEBERG_TOKEN}"
              fi
              curl -fsS -X POST \
                "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET}" \
                -H "Authorization: token ${CODEBERG_TOKEN}" \
                -F "attachment=@${ASSET}"
          done
          echo "Published release ${RELEASE_ID} with APK + checksum attached."
