# Builds and publishes a signed release APK whenever a vX.Y.Z tag is pushed.
#
# Required Codeberg Actions secrets (Settings → Actions → Secrets):
#   WRISTOTLE_KEYSTORE_BASE64    base64-encoded contents of wristotle-release.keystore
#                                  generate locally: base64 -i wristotle-release.keystore | pbcopy
#   WRISTOTLE_KEYSTORE_PASSWORD  password set during `keytool -genkey`
#   WRISTOTLE_KEY_ALIAS          alias passed to `keytool -alias`
#   WRISTOTLE_KEY_PASSWORD       key alias password (usually same as KEYSTORE_PASSWORD)
#
# GITHUB_TOKEN is auto-provided by Forgejo Actions and has write access to
# releases on the same repo.

name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Codeberg's shared runners use sized labels rather than the generic
    # `docker`/`ubuntu-latest` GitHub conventions. The whisper.cpp + ggml
    # cold compile is the bulk of the wall time and benefits from the
    # extra CPU/RAM on the medium tier; small would also work but slower.
    runs-on: codeberg-medium
    steps:
      - name: Checkout (with whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # versionCode = 2 digits per component (max 99.99.99). Bumps
          # monotonically as long as the version string is well-formed.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG → versionName=$VERSION, versionCode=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        # Forgejo's action mirror (data.forgejo.org) only carries a subset
        # of upstream actions, and android-actions/setup-android isn't
        # among them. Use the GitHub URL explicitly — Forgejo Actions
        # accepts the full https://github.com/owner/repo@ref form.
        uses: https://github.com/android-actions/setup-android@v3

      - name: Install pinned NDK + CMake
        # The :speech-whisper module pins ndkVersion = 30.0.14904198 and
        # CMake 3.22.1. Install them explicitly so the build doesn't
        # transparently fall back to whatever setup-android brought down.
        run: |
          sdkmanager --install "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Cache CMake / .cxx build output
        uses: actions/cache@v4
        with:
          path: |
            speech-whisper/.cxx
            speech-whisper/build/intermediates/cxx
          # whisper.cpp source rarely changes; cache key is whichever pinned
          # version the submodule resolves to.
          key: cxx-${{ runner.os }}-${{ hashFiles('speech-whisper/src/main/cpp/whisper.cpp/CMakeLists.txt') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WRISTOTLE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/wristotle-release.keystore"
          test -s "$GITHUB_WORKSPACE/wristotle-release.keystore"

      - name: Ensure jq is available
        # Codeberg's shared runner image (catthehacker/ubuntu) ships with
        # jq pre-installed; the leaner image self-hosted runners often
        # default to doesn't. The publish step builds its JSON payloads
        # via jq, so install it up front instead of failing later with
        # an opaque 422 from the Codeberg API.
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends jq
          fi

      - name: Run unit tests
        # Fail fast before paying the release-build cost if a recent commit
        # broke a dedup / slot / prefix test. --no-daemon for the same
        # reason as assembleRelease below: the medium runner is tight on
        # RAM, and a long-lived daemon + the forked test JVM + cmake/ninja
        # subprocesses competing on a ~4 GB box trip the OOM killer.
        # v0.14.1 saw two consecutive daemon-disappeared failures here
        # before this was added; --no-daemon cleared it.
        run: ./gradlew --no-daemon -Dorg.gradle.workers.max=2 :app:testDebugUnitTest :speech-whisper:testDebugUnitTest

      - name: Build release APK
        env:
          WRISTOTLE_KEYSTORE_FILE: ${{ github.workspace }}/wristotle-release.keystore
          WRISTOTLE_KEYSTORE_PASSWORD: ${{ secrets.WRISTOTLE_KEYSTORE_PASSWORD }}
          WRISTOTLE_KEY_ALIAS: ${{ secrets.WRISTOTLE_KEY_ALIAS }}
          WRISTOTLE_KEY_PASSWORD: ${{ secrets.WRISTOTLE_KEY_PASSWORD }}
          WRISTOTLE_VERSION_NAME: ${{ steps.version.outputs.name }}
          WRISTOTLE_VERSION_CODE: ${{ steps.version.outputs.code }}
          # JVM heaps live in gradle.properties so the daemon actually
          # honours them (CLI overrides reach the launcher only, not the
          # daemon). What's left here is ninja's parallel-compile cap so
          # whisper.cpp + ggml don't fork 4 g++ subprocesses on top of
          # the ~3 GB of JVM heap and exceed the medium runner's budget.
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: ./gradlew --no-daemon -Dorg.gradle.workers.max=2 :app:assembleRelease

      - name: Stage APK under a versioned name
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             wristotle-companion-${{ steps.version.outputs.name }}.apk

      - name: Publish release + upload APK
        env:
          CODEBERG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -eu

          # Auto-generate the change list from commit subjects since the
          # previous tag. fetch-depth: 0 gives full history + tags. First
          # release (no prior tag) falls back to the whole history.
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:'- %s')
            SINCE="Changes since \`$PREV_TAG\`:"
          else
            CHANGES=$(git log "${TAG}" --no-merges --pretty=format:'- %s')
            SINCE="Changes:"
          fi
          [ -n "$CHANGES" ] || CHANGES="- (no code changes)"

          BODY=$(cat <<EOF
          Built from \`$TAG\` ($(git rev-parse --short HEAD)).

          $SINCE

          $CHANGES

          Full commit log on the [Code tab](https://codeberg.org/${GITHUB_REPOSITORY}/commits/branch/main).

          Install: download the APK below, sideload onto an Android 7.0+ phone, then follow the first-time setup in the README.
          EOF
          )

          api() { curl -sS -w '\n%{http_code}' "$@"; }

          # Codeberg auto-creates a release entry for every pushed tag, so a
          # release for $TAG already exists by the time this workflow runs.
          # Look it up first; only create if the lookup 404s. The release we
          # find (or create) carries an id we use to attach the APK asset.
          RELEASE_LOOKUP=$(api \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            -H "Authorization: token ${CODEBERG_TOKEN}")
          LOOKUP_BODY=$(printf '%s' "$RELEASE_LOOKUP" | sed '$d')
          LOOKUP_STATUS=$(printf '%s' "$RELEASE_LOOKUP" | tail -n1)

          if [ "$LOOKUP_STATUS" = "200" ]; then
            RELEASE_ID=$(echo "$LOOKUP_BODY" | jq -r '.id')
            echo "Found existing release ${RELEASE_ID} for ${TAG}; updating name + body."
            # Refresh name/body so the auto-created entry shows useful info.
            curl -fsS -X PATCH \
              "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg name "Wristotle Companion $VERSION" --arg body "$BODY" \
                    '{name: $name, body: $body, draft: false, prerelease: false}')" \
              > /dev/null
          else
            echo "No existing release for ${TAG} (lookup status ${LOOKUP_STATUS}); creating."
            CREATE_RESP=$(curl -fsS -X POST \
              "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" --arg name "Wristotle Companion $VERSION" --arg body "$BODY" \
                    '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
            RELEASE_ID=$(echo "$CREATE_RESP" | jq -r '.id')
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Couldn't resolve a release id."
            exit 1
          fi

          # If an asset with this name was already uploaded (re-run of the
          # workflow on the same tag), delete it first — Codeberg's upload
          # endpoint rejects duplicate filenames within a release.
          EXISTING_ASSETS=$(curl -fsS \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            -H "Authorization: token ${CODEBERG_TOKEN}")
          DUP_ID=$(echo "$EXISTING_ASSETS" | jq -r ".[] | select(.name == \"wristotle-companion-${VERSION}.apk\") | .id")
          if [ -n "$DUP_ID" ] && [ "$DUP_ID" != "null" ]; then
            echo "Removing previously-uploaded asset ${DUP_ID}."
            curl -fsS -X DELETE \
              "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets/${DUP_ID}" \
              -H "Authorization: token ${CODEBERG_TOKEN}"
          fi

          # Attach the APK as a release asset.
          curl -fsS -X POST \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=wristotle-companion-${VERSION}.apk" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -F "attachment=@wristotle-companion-${VERSION}.apk"
          echo "Published release ${RELEASE_ID} with APK attached."
