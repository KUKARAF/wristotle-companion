# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Daemon + Kotlin daemon heaps, tuned for both local dev and the
# Codeberg medium runner (~4 GB total). The CI release build adds
# ninja + cmake + g++ subprocesses on top; with 1.5 GB Gradle + 1 GB
# Kotlin we stay under ~3 GB JVM total and leave room for the native
# compile without tripping the OOM killer. Setting these via env vars
# / -P flags doesn't reach the daemon JVM — gradle.properties is the
# only place that does.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9.x ships with built-in Kotlin, which by default rejects KSP-generated
# kotlin source directories added via the kotlin.sourceSets DSL. Room (via
# KSP) needs to register its generated dirs that way until KSP catches up
# with AGP 9's built-in-Kotlin mode. Disabling this guard rail unblocks
# Room compilation; revisit if/when KSP integrates with built-in Kotlin.
android.disallowKotlinSourceSets=false