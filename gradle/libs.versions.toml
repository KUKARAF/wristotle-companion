[versions]
agp = "9.2.1"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
pebblekit = "1.2.0"
coroutines = "1.8.1"
prettytime = "5.0.7.Final"
navigationCompose = "2.8.5"
room = "2.7.1"
ksp = "2.2.10-2.0.2"
onnxruntime = "1.22.0"
zip4j = "2.11.5"
orgJson = "20231013"
# MCP client — phase A of the AskAgent feature. Uses the official MCP SDK
# over Ktor's OkHttp engine on Android. kotlinx-serialization is required
# by both the SDK and Ktor's content negotiation.
# 0.9.0+ fixes SseClientTransport's endpoint resolution: an absolute-path
# `endpoint` event (e.g. n8n's `/mcp/<flow>/messages`) now resolves against
# the origin instead of being string-joined onto the SSE base path — 0.8.3
# duplicated the path segment and every POST 404'd on servers that return an
# absolute path (issue #20).
# 0.14.0 is the ceiling for our current toolchain: 0.15.0 is built against
# Kotlin 2.4.0 metadata, which the Kotlin 2.2.10 compiler can't read (it
# reads up to 2.3.0). Moving past 0.14.0 requires a project-wide Kotlin
# 2.4.x upgrade (+ matching KSP / Compose compiler), so bump this together
# with `kotlin` when that happens.
mcp = "0.14.0"
ktor = "3.4.0"
kotlinxSerialization = "1.7.3"
# kotlinx-datetime — multiplatform replacement for java.util.{Date, Calendar,
# TimeZone} + java.text.SimpleDateFormat that's portable to Kotlin/Native.
# First consumer is TodayRange (R2 batch 3); follow-up batches lift the
# Date-using slot files + MorningBriefRenderer.
kotlinxDatetime = "0.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.0.1" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

pebblekit = { module = "io.rebble.pebblekit2:client", version.ref = "pebblekit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
prettytime-nlp = { module = "org.ocpsoft.prettytime:prettytime-nlp", version.ref = "prettytime" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# MCP client — phase A of AskAgent
mcp-kotlin-sdk = { group = "io.modelcontextprotocol", name = "kotlin-sdk", version.ref = "mcp" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9's KMP-aware library plugin. Replaces (com.android.library +
# kotlin.multiplatform) for modules that need both Android + iOS
# targets — AGP 9 rejects that legacy combo. Used by :wristotle-core
# from the iOS spike (S1a) onward.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

